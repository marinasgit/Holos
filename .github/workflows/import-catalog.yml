name: Import catalog

# Picks up newly released sets and cards from TCGdex once a week.
on:
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: scripts
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check for Supabase secrets
        if: env.SUPABASE_URL == '' || env.SUPABASE_SERVICE_ROLE_KEY == ''
        working-directory: .
        run: echo "::notice::Add the SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY repository secrets to enable catalog imports."
      - uses: actions/checkout@v4
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
      - uses: actions/setup-node@v4
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - run: npm ci
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
      - run: npm run import-catalog
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
